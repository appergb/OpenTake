name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable 40-hex commit SHA already present in this repository
        required: true
        type: string
      red_task:
        description: Focused Windows expected-RED slice; none runs normal native gates
        required: true
        default: none
        type: choice
        options: [none, 6b, 7a, 7b, 7c]
      red_parent_sha:
        description: Exact parent SHA for a focused Windows expected-RED slice
        required: false
        default: ''
        type: string
      red_nonce:
        description: Unique 16-lower-hex correlation nonce for expected-RED evidence
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.commit_sha || github.sha }}-${{ inputs.red_task || 'normal' }}-${{ inputs.red_nonce || 'none' }}
  cancel-in-progress: true

jobs:
  motion-canvas:
    name: Motion Canvas (locked build / audit / license)
    if: github.event_name != 'workflow_dispatch' || inputs.red_task == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/motion-canvas-studio/package-lock.json

      - name: Install locked Motion Canvas dependencies
        run: npm --prefix plugins/motion-canvas-studio ci --ignore-scripts

      - name: Audit dependencies and licenses
        run: |
          npm --prefix plugins/motion-canvas-studio audit --audit-level=moderate
          npm --prefix plugins/motion-canvas-studio run licenses

      - name: Test and reproduce embedded runner
        run: |
          npm --prefix plugins/motion-canvas-studio test
          npm --prefix plugins/motion-canvas-studio run build
          git diff --exit-code -- plugins/motion-canvas-studio/bundle/runner.html plugins/motion-canvas-studio/package-lock.json

  rust:
    name: Rust (fmt / clippy / test)
    if: github.event_name != 'workflow_dispatch' || inputs.red_task == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The playback engine (#53) is now a DEFAULT feature, so the workspace
      # fmt/clippy/test steps below compile it (cpal + axum/tokio + the wgpu
      # render path). Reclaim runner disk up front — these deps are heavy and the
      # hosted runner's default free space is tight.
      - name: Free disk space (playback-engine deps are heavy)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Install system deps (ffmpeg + Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            patchelf \
            pkg-config \
            fonts-dejavu-core

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Validate Windows product gate contract
        run: |
          python3 -B scripts/check_windows_product_ci.py
          python3 -B -m unittest discover -s scripts -p 'test_check_windows_product_ci.py'

      - name: cargo fmt
        run: cargo fmt --all --check

      # `--workspace` compiles the default features, which now include
      # opentake-tauri's `playback-engine` — so these two steps also lint and test
      # the streaming engine (its unit tests: drain/clock/projection/transport).
      # The GPU+ffmpeg integration tests in src-tauri/tests/ compile here too and
      # auto-skip on the GPU-less / ffmpeg-less runner.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: live playback transport integration (fail closed)
        run: |
          set -euo pipefail
          cargo test -p opentake-tauri \
            --features playback-engine \
            --test playback_transport_integration \
            -- --test-threads=1

      # Prove the minimal build still compiles WITHOUT the engine (the
      # `--no-default-features` escape hatch: drops cpal/axum/tokio + the
      # `playback_*` commands; the front end then falls back to the legacy path).
      - name: cargo clippy (minimal, no default features)
        run: cargo clippy -p opentake-tauri --no-default-features --all-targets -- -D warnings

  windows-product:
    name: Windows (full product / bundle)
    if: github.event_name != 'workflow_dispatch' || inputs.red_task == 'none'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CI: true
    steps:
      - name: Validate immutable SHA input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checked-out SHA
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Provision checksum-pinned packaged FFmpeg sidecars
        run: python scripts/provision_ffmpeg_sidecars.py --target x86_64-pc-windows-msvc

      - name: Verify sidecar supply and probe/decode/encode boundary without PATH
        shell: bash
        run: ruby scripts/tests/packaged-sidecars-test.rb --name packaged_macos_windows_sidecars_resolve_and_execute

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-product-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: windows-product-

      - name: Install locked Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Web editor behavior suite
        run: pnpm -C web test

      - name: Rust workspace tests
        run: cargo test --workspace -- --test-threads=1

      - name: Minimal-feature Tauri clippy
        run: cargo clippy -p opentake-tauri --no-default-features --all-targets -- -D warnings

      - name: Web production build
        run: pnpm -C web build

      - name: Build native MSI and NSIS installers
        shell: pwsh
        run: |
          Remove-Item 'target/release/bundle/msi' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'target/release/bundle/nsis' -Recurse -Force -ErrorAction SilentlyContinue
          & .\web\node_modules\.bin\tauri.cmd build --ci --bundles msi,nsis

      - name: Install NSIS package and execute installed product without PATH
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'target/release/bundle/nsis/*.exe' -File)
          if ($installer.Count -ne 1) { throw 'expected exactly one NSIS installer' }
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "silent NSIS install failed: $($process.ExitCode)" }
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'OpenTake/opentake.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs/OpenTake/opentake.exe'),
            (Join-Path $env:ProgramFiles 'OpenTake/opentake.exe')
          )
          $application = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $application) {
            $uninstall = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' `
              -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'OpenTake' } | Select-Object -First 1
            if ($uninstall.InstallLocation) {
              $application = Get-ChildItem $uninstall.InstallLocation -Filter 'opentake.exe' -File `
                -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
            }
          }
          if (-not $application) { throw "installed OpenTake executable not found: $($candidates -join ', ')" }
          $installDirectory = Split-Path -Parent $application
          ruby scripts/tests/packaged-sidecars-test.rb `
            --name packaged_macos_windows_sidecars_resolve_and_execute `
            --package $installDirectory
          $app = Start-Process -FilePath $application -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) {
            throw "installed OpenTake exited during launch smoke test: $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force
          Wait-Process -Id $app.Id -ErrorAction SilentlyContinue

      - name: Bind installers to the exact source SHA
        shell: pwsh
        env:
          RECEIPT_SHA: ${{ steps.bind.outputs.sha }}
        run: |
          $msi = @(Get-ChildItem 'target/release/bundle/msi/*.msi' -File)
          $nsis = @(Get-ChildItem 'target/release/bundle/nsis/*.exe' -File)
          if ($msi.Count -lt 1) { throw 'Tauri did not produce an MSI installer' }
          if ($nsis.Count -lt 1) { throw 'Tauri did not produce an NSIS installer' }
          $artifacts = @($msi + $nsis) | ForEach-Object {
            [ordered]@{
              path = $_.FullName.Substring((Get-Location).Path.Length + 1).Replace('\', '/')
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = $_.Length
            }
          }
          $receipt = [ordered]@{
            schema = 'opentake-windows-product-receipt-v1'
            repository = '${{ github.repository }}'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            source_sha = $env:RECEIPT_SHA
            artifacts = @($artifacts)
          }
          $receipt | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM windows-product-receipt.json

      - name: Upload exact-SHA Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: opentake-windows-${{ steps.bind.outputs.sha }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            windows-product-receipt.json
          if-no-files-found: error
          retention-days: 30

  windows-security:
    name: Windows (cancel / reparse safety)
    if: github.event_name != 'workflow_dispatch' || inputs.red_task == 'none'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt

      - name: Provision checksum-pinned packaged FFmpeg sidecars
        run: python scripts/provision_ffmpeg_sidecars.py --target x86_64-pc-windows-msvc

      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-security-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-security-cargo-

      - name: Portable FFmpeg cancellation lifecycle
        shell: pwsh
        run: |
          cargo test -p opentake-media --lib windows_cancelling_running_pcm_child_reaps_both_pipe_readers
          cargo test -p opentake-media --lib windows_cancelling_mux_wait_reaps_child

      - name: Verify portable Tauri test image imports
        shell: pwsh
        run: |
          cargo test -p opentake-tauri --lib --no-run
          $testImage = Get-ChildItem 'target/debug/deps/opentake_tauri_lib-*.exe' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $testImage) { throw 'compiled Tauri test image not found' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          & $dumpbin /DEPENDENTS $testImage.FullName | Set-Content windows-tauri-test-imports.txt
          & $dumpbin /IMPORTS $testImage.FullName | Add-Content windows-tauri-test-imports.txt
          $imports = Get-Content windows-tauri-test-imports.txt -Raw
          if ($imports -match '(?im)^\s*(MSVCP140|onnxruntime|DirectML)\.dll\s*$') {
            throw 'Tauri test image retains a non-portable native runtime dependency'
          }

      - name: Reserved output identity and reparse safety
        shell: pwsh
        run: |
          cargo test -p opentake-tauri --lib windows_project_media_junction_is_rejected_without_writing_target
          cargo test -p opentake-tauri --lib windows_directory_handoff_blocks_junction_replacement_before_child_create
          cargo test -p opentake-tauri --lib windows_retained_output_handle_blocks_final_name_replacement

      - name: Upload Tauri test image imports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-test-imports-${{ github.sha }}
          path: windows-tauri-test-imports.txt
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web (install / build)
    if: github.event_name != 'workflow_dispatch' || inputs.red_task == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm -C web install

      - name: pnpm build
        run: pnpm -C web build

      - name: pnpm test
        run: pnpm -C web test

  windows-library-security:
    name: Windows (library capability security)
    if: github.event_name != 'workflow_dispatch' || inputs.red_task == 'none'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Provision checksum-pinned packaged FFmpeg sidecars
        run: python scripts/provision_ffmpeg_sidecars.py --target x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-library-security-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-library-security-

      - name: Test retained-handle and junction defenses
        run: cargo test -p opentake-media library::tests -- --test-threads=1

      - name: Test complete bundle publication and recovery
        run: cargo test -p opentake-project -- --test-threads=1

      - name: Test Tauri project-library commit guards
        run: cargo test -p opentake-tauri library::tests -- --test-threads=1

      - name: Clippy capability-backed library
        run: cargo clippy -p opentake-media --all-targets -- -D warnings

  safe-filesystem:
    name: Safe filesystem (${{ matrix.receipt_id }})
    if: github.event_name != 'workflow_dispatch' || inputs.red_task == 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - receipt_id: linux-x86_64
            runner: ubuntu-24.04
            expected_os: Linux
            expected_arch: X64
          - receipt_id: macos-native
            runner: macos-14
            expected_os: macOS
            expected_arch: ARM64
          - receipt_id: windows-x86_64
            runner: windows-2022
            expected_os: Windows
            expected_arch: X64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      RECEIPT_DIR: c1b-native-receipt
    steps:
      - name: Validate immutable SHA input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checked-out SHA
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          printf 'sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"
      - name: Install Rust components
        shell: bash
        run: rustup component add rustfmt clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: safe-fs-${{ matrix.receipt_id }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: safe-fs-${{ matrix.receipt_id }}-
      - name: Parse Windows expected-RED harness
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/run-c1b-windows-red.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Re-assert immutable target before native gates
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "${expected}^{tree}")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run all native gates and retain every exit
        shell: bash
        run: |
          set -u
          mkdir "$RECEIPT_DIR"
          aggregate=0
          run_gate() {
            id="$1"
            shift
            {
              printf '$'
              printf ' %q' "$@"
              printf '\n'
            } >"$RECEIPT_DIR/$id.log"
            set +e
            "$@" >>"$RECEIPT_DIR/$id.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" >"$RECEIPT_DIR/$id.raw-exit"
            if [ "$code" -ne 0 ]; then aggregate=1; fi
          }
          set -e
          run_gate cargo-fmt cargo fmt --all --check
          run_gate cargo-clippy cargo clippy -p opentake-project --lib --tests -- -D warnings
          run_gate safe-fs-unit cargo test -p opentake-project --lib safe_fs -- --test-threads=1
          run_gate archive-security cargo test -p opentake-project --test archive_security -- --test-threads=1
          printf '%s\n' "$aggregate" >"$RECEIPT_DIR/final-aggregate.raw-exit"
      - name: Build exclusive JSON receipt
        if: always()
        shell: pwsh
        env:
          RECEIPT_SHA: ${{ steps.bind.outputs.sha }}
          RECEIPT_ID: ${{ matrix.receipt_id }}
          RUNNER_LABEL: ${{ matrix.runner }}
          EXPECTED_RUNNER_OS: ${{ matrix.expected_os }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_arch }}
        run: |
          if ('${{ runner.os }}' -ne $env:EXPECTED_RUNNER_OS) { throw 'runner OS does not match receipt id' }
          if ('${{ runner.arch }}' -ne $env:EXPECTED_RUNNER_ARCH) { throw 'runner architecture does not match receipt id' }
          $commands = @(
            @{ id = 'cargo-fmt'; command = 'cargo fmt --all --check' },
            @{ id = 'cargo-clippy'; command = 'cargo clippy -p opentake-project --lib --tests -- -D warnings' },
            @{ id = 'safe-fs-unit'; command = 'cargo test -p opentake-project --lib safe_fs -- --test-threads=1' },
            @{ id = 'archive-security'; command = 'cargo test -p opentake-project --test archive_security -- --test-threads=1' }
          ) | ForEach-Object {
            $exitPath = Join-Path $env:RECEIPT_DIR ($_.id + '.raw-exit')
            $_ + @{ exit_code = [int](Get-Content $exitPath); log = ($_.id + '.log'); raw_exit = ($_.id + '.raw-exit') }
          }
          $receipt = [ordered]@{
            schema = 'opentake-c1b-native-receipt-v1'
            repository = '${{ github.repository }}'
            workflow = '${{ github.workflow }}'
            workflow_file = '.github/workflows/ci.yml'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            job_id = '${{ github.job }}'
            receipt_id = $env:RECEIPT_ID
            runner_label = $env:RUNNER_LABEL
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            event_name = '${{ github.event_name }}'
            requested_sha = $env:TARGET_SHA.ToLowerInvariant()
            checked_out_sha = $env:RECEIPT_SHA.ToLowerInvariant()
            dispatcher_sha = '${{ github.workflow_sha }}'
            dispatcher_ref = '${{ github.workflow_ref }}'.Split('@')[-1]
            commands = @($commands)
            aggregate_exit = [int](Get-Content (Join-Path $env:RECEIPT_DIR 'final-aggregate.raw-exit'))
          }
          $receipt | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM (Join-Path $env:RECEIPT_DIR 'receipt.json')
      - name: Upload immutable native receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1b-native-${{ matrix.receipt_id }}-${{ steps.bind.outputs.sha }}
          path: c1b-native-receipt/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce native aggregate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RECEIPT_DIR/final-aggregate.raw-exit"
          test "$(cat "$RECEIPT_DIR/final-aggregate.raw-exit")" = 0

  windows-red-evidence:
    name: Windows expected RED (${{ inputs.red_task }})
    if: github.event_name == 'workflow_dispatch' && inputs.red_task != 'none'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      PARENT_SHA: ${{ inputs.red_parent_sha }}
      RED_TASK: ${{ inputs.red_task }}
      RED_NONCE: ${{ inputs.red_nonce }}
      DISPATCHER_SHA: ${{ github.workflow_sha }}
      DISPATCHER_REF: ${{ github.workflow_ref }}
    steps:
      - name: Validate immutable RED inputs
        shell: pwsh
        run: |
          if ($env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'commit_sha must be lower 40-hex' }
          if ($env:PARENT_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'red_parent_sha must be lower 40-hex' }
          if ($env:RED_NONCE -cnotmatch '^[0-9a-f]{16}$') { throw 'red_nonce must be unique lower 16-hex' }
      - name: Checkout trusted RED dispatcher
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DISPATCHER_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: c1b-dispatcher
      - name: Assert trusted RED dispatcher
        id: bind-dispatcher
        shell: pwsh
        run: |
          $expectedRef = '${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main'
          if ($env:DISPATCHER_REF -cne $expectedRef) { throw 'RED dispatcher is not the trusted main workflow' }
          $actual = (git -C c1b-dispatcher rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -cne $env:DISPATCHER_SHA) { throw 'RED dispatcher SHA mismatch' }
          "sha=$actual" >> $env:GITHUB_OUTPUT
      - name: Checkout RED target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false
          path: c1b-target
      - name: Assert exact RED commit and parent
        id: bind-red
        shell: pwsh
        run: |
          Set-Location c1b-target
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $parent = (git rev-parse 'HEAD^').Trim().ToLowerInvariant()
          $commitRow = @((git rev-list --parents -n 1 HEAD).Trim().Split(' '))
          $changedPaths = @(git diff-tree --no-commit-id --name-only -r HEAD)
          if ($actual -cne $env:TARGET_SHA) { throw 'checked-out RED SHA mismatch' }
          if ($parent -cne $env:PARENT_SHA) { throw 'RED parent SHA mismatch' }
          if ($commitRow.Count -ne 2) { throw 'RED commit must have exactly one parent' }
          if ($changedPaths.Count -ne 1 -or $changedPaths[0] -cne 'crates/opentake-project/src/safe_fs/windows.rs') {
            throw 'RED commit changed paths outside windows.rs'
          }
          "sha=$actual" >> $env:GITHUB_OUTPUT
      - name: Run focused expected-RED contract
        shell: pwsh
        run: |
          Set-Location c1b-target
          ../c1b-dispatcher/scripts/run-c1b-windows-red.ps1 `
            -Task $env:RED_TASK -TestSha $env:TARGET_SHA -ParentSha $env:PARENT_SHA `
            -Nonce $env:RED_NONCE -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'c1b-red')
      - name: Upload immutable Windows RED receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1b-red-${{ inputs.red_task }}-${{ steps.bind-red.outputs.sha }}-${{ inputs.red_nonce }}
          path: ${{ runner.temp }}/c1b-red/c1b-task-${{ inputs.red_task }}-${{ steps.bind-red.outputs.sha }}-${{ inputs.red_nonce }}/
          if-no-files-found: error
          retention-days: 30
