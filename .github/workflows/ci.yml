name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The playback engine (#53) is now a DEFAULT feature, so the workspace
      # fmt/clippy/test steps below compile it (cpal + axum/tokio + the wgpu
      # render path). Reclaim runner disk up front — these deps are heavy and the
      # hosted runner's default free space is tight.
      - name: Free disk space (playback-engine deps are heavy)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Install system deps (ffmpeg + Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            patchelf \
            pkg-config \
            fonts-dejavu-core

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `tauri.conf.json` bundles `lib/libmpv-wrapper.dylib` unconditionally
      # (macOS-only — used by the libmpv PLAY path). tauri_build's resource
      # check fails on Linux because the dylib isn't committed for non-macOS.
      # Create an empty placeholder so the resource path resolves; it's never
      # actually bundled here since `cargo clippy`/`test` don't run `tauri build`.
      - name: Create libmpv placeholder for Linux CI
        run: |
          mkdir -p src-tauri/lib
          touch src-tauri/lib/libmpv-wrapper.dylib

      - name: cargo fmt
        run: cargo fmt --all --check

      # `--workspace` compiles the default features, which now include
      # opentake-tauri's `playback-engine` — so these two steps also lint and test
      # the streaming engine (its unit tests: drain/clock/projection/transport).
      # The GPU+ffmpeg integration tests in src-tauri/tests/ compile here too and
      # auto-skip on the GPU-less / ffmpeg-less runner.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # Prove the minimal build still compiles WITHOUT the engine (the
      # `--no-default-features` escape hatch: drops cpal/axum/tokio + the
      # `playback_*` commands; the front end then falls back to the legacy path).
      - name: cargo clippy (minimal, no default features)
        run: cargo clippy -p opentake-tauri --no-default-features --all-targets -- -D warnings

  web:
    name: Web (install / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm -C web install

      - name: pnpm build
        run: pnpm -C web build

      - name: pnpm test
        run: pnpm -C web test
