name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<semver> tag from a failed run; this workflow never creates or moves tags
        required: true
        type: string
      failed_run_id:
        description: Root failed tag-push Release run ID (31412976593) for the immutable source
        required: true
        type: string
      failed_recovery_run_id:
        description: Previous failed workflow_dispatch recovery Release run ID (31427093503) chained to the same immutable source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      FAILED_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.failed_run_id || '' }}
      FAILED_RECOVERY_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.failed_recovery_run_id || '' }}
      RELEASE_TOOLING_SHA: ${{ github.workflow_sha }}
    outputs:
      source_sha: ${{ steps.bind.outputs.source_sha }}
      tooling_sha: ${{ steps.bind.outputs.tooling_sha }}
      tag: ${{ steps.bind.outputs.tag }}
      version: ${{ steps.bind.outputs.version }}
      notes_path: ${{ steps.bind.outputs.notes_path }}
      prerelease: ${{ steps.bind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, source SHA, versions, and notes
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "appergb/OpenTake"
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          source_sha="$(git rev-parse "${RELEASE_TAG}^{commit}" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$source_sha"
          git cat-file -e "${source_sha}^{commit}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          tooling_sha="$(printf '%s' "$RELEASE_TOOLING_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$tooling_sha" =~ ^[0-9a-f]{40}$ ]]
          read -r remote_main remote_ref < <(git ls-remote --exit-code origin refs/heads/main)
          remote_main="$(printf '%s' "$remote_main" | tr '[:upper:]' '[:lower:]')"
          test "$remote_ref" = "refs/heads/main"
          predecessor_tooling_sha="6162466834bbabb8a16a2c08808e03a53c2b22b6"
          if [[ "$GITHUB_EVENT_NAME" = "push" ]]; then
            test -z "$FAILED_RUN_ID"
            test -z "$FAILED_RECOVERY_RUN_ID"
            test "$tooling_sha" = "$source_sha"
            if [[ "$source_sha" != "$remote_main" ]]; then
              echo "tag commit does not equal current remote main HEAD" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]]; then
            [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$FAILED_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test "$FAILED_RUN_ID" = "31412976593"
            test "$FAILED_RECOVERY_RUN_ID" = "31427093503"
            test "$tooling_sha" = "$remote_main"
            recovery_root="$RUNNER_TEMP/opentake-release-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$recovery_root/tooling"
            if ! git cat-file -e "${tooling_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$tooling_sha"
            fi
            test "$(git rev-parse "${tooling_sha}^{commit}")" = "$tooling_sha"
            git cat-file blob "$tooling_sha:scripts/check_release_workflow.py" \
              > "$recovery_root/tooling/check_release_workflow.py"
            git cat-file blob "$tooling_sha:scripts/workflow_yaml.py" \
              > "$recovery_root/tooling/workflow_yaml.py"
            test -s "$recovery_root/tooling/check_release_workflow.py"
            test -s "$recovery_root/tooling/workflow_yaml.py"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID" \
              > "$recovery_root/root-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID/jobs?per_page=100" \
              > "$recovery_root/root-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$predecessor_tooling_sha" \
              > "$recovery_root/source-to-predecessor.json"
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$recovery_root/tooling" \
              python3 "$recovery_root/tooling/check_release_workflow.py" \
              validate-recovery-run \
              --run "$recovery_root/root-run.json" \
              --jobs "$recovery_root/root-jobs.json" \
              --comparison "$recovery_root/source-to-predecessor.json" \
              --run-id "$FAILED_RUN_ID" \
              --tag "$RELEASE_TAG" \
              --sha "$source_sha" \
              --comparison-head-sha "$predecessor_tooling_sha"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_RUN_ID" \
              > "$recovery_root/predecessor-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_RUN_ID/jobs?per_page=100" \
              > "$recovery_root/predecessor-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_RUN_ID/artifacts?per_page=100" \
              > "$recovery_root/predecessor-artifacts.json"
            gh api "repos/$GITHUB_REPOSITORY/compare/$predecessor_tooling_sha...$remote_main" \
              > "$recovery_root/predecessor-to-current.json"
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$recovery_root/tooling" \
              python3 "$recovery_root/tooling/check_release_workflow.py" \
              validate-failed-recovery-run \
              --run "$recovery_root/predecessor-run.json" \
              --jobs "$recovery_root/predecessor-jobs.json" \
              --artifacts "$recovery_root/predecessor-artifacts.json" \
              --tooling-comparison "$recovery_root/predecessor-to-current.json" \
              --run-id "$FAILED_RECOVERY_RUN_ID" \
              --tag "$RELEASE_TAG" \
              --source-sha "$source_sha" \
              --tooling-sha "$predecessor_tooling_sha" \
              --current-tooling-sha "$tooling_sha"
          else
            echo "unsupported release event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi

          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'tooling_sha=%s\n' "$tooling_sha" >> "$GITHUB_OUTPUT"
          RELEASE_TAG="$RELEASE_TAG" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tomllib

          numeric = r"(?:0|[1-9][0-9]*)"
          identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          SEMVER_RE = re.compile(
              rf"^v{numeric}\.{numeric}\.{numeric}"
              rf"(?:-{identifier}(?:\.{identifier})*)?$"
          )
          tag = os.environ["RELEASE_TAG"]
          if "+" in tag:
              raise SystemExit("SemVer build metadata is unsupported for updater asset URLs")
          if SEMVER_RE.fullmatch(tag) is None:
              raise SystemExit(f"release tag is not v<semver>: {tag}")
          version = tag[1:]
          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          web = json.loads(Path("web/package.json").read_text(encoding="utf-8"))
          versions = {
              cargo["workspace"]["package"]["version"],
              tauri["version"],
              web["version"],
          }
          if versions != {version}:
              raise SystemExit(f"tag/version mismatch: {tag} != {sorted(versions)}")
          wix_version = tauri["bundle"]["windows"]["wix"]["version"]
          if wix_version != "1.0.0.4":
              raise SystemExit(f"unexpected Windows installer version: {wix_version}")
          notes = Path("docs/releases") / f"{version}.md"
          if not notes.is_file() or not notes.read_text(encoding="utf-8").strip():
              raise SystemExit(f"release notes are missing or empty: {notes}")
          prerelease = "-" in version.split("+", 1)[0]
          if version == "1.0.0-beta.4" and not prerelease:
              raise SystemExit("OpenTake 1.0.0-beta.4 must remain a prerelease")
          if not prerelease:
              raise SystemExit("this release workflow publishes prereleases only")

          def emit(name: str, value: str) -> None:
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
                  stream.write(f"{name}={value}\n")

          emit("tag", tag)
          emit("version", version)
          emit("notes_path", notes.as_posix())
          emit("prerelease", "true")
          PY

      - name: Reassert exact source after validation
        env:
          EXPECTED_SHA: ${{ steps.bind.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test "$(git rev-parse "${actual}^{tree}")" = "$(git rev-parse "${expected}^{tree}")"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  quality:
    name: Release quality gates
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_SHA: ${{ needs.validate.outputs.source_sha }}
      RELEASE_TOOLING_SHA: ${{ needs.validate.outputs.tooling_sha }}
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Install system deps (ffmpeg + Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            patchelf \
            pkg-config \
            fonts-dejavu-core

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-quality-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: release-quality-cargo-

      - name: Install locked Motion Canvas dependencies
        run: npm --prefix plugins/motion-canvas-studio ci --ignore-scripts

      - name: Audit Motion Canvas dependencies and licenses
        run: |
          npm --prefix plugins/motion-canvas-studio audit --audit-level=moderate
          npm --prefix plugins/motion-canvas-studio run licenses

      - name: Test and reproduce Motion Canvas runner
        run: |
          npm --prefix plugins/motion-canvas-studio test
          npm --prefix plugins/motion-canvas-studio run build
          git diff --exit-code -- plugins/motion-canvas-studio/bundle/runner.html plugins/motion-canvas-studio/package-lock.json

      - name: Validate Windows and release workflow contracts
        run: |
          set -euo pipefail
          python3 -B scripts/check_windows_product_ci.py
          python3 -B -m unittest discover -s scripts -p 'test_check_windows_product_ci.py'
          python3 -B -m unittest discover -s scripts -p 'test_write_updater_attestation.py'
          python3 -B -m unittest discover -s scripts -p 'test_write_updater_manifest.py'
          tooling_root="$RUNNER_TEMP/opentake-release-tooling-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$tooling_root"
          if ! git cat-file -e "${RELEASE_TOOLING_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$RELEASE_TOOLING_SHA"
          fi
          test "$(git rev-parse "${RELEASE_TOOLING_SHA}^{commit}")" = "$RELEASE_TOOLING_SHA"
          git cat-file blob "$RELEASE_TOOLING_SHA:scripts/check_release_workflow.py" \
            > "$tooling_root/check_release_workflow.py"
          git cat-file blob "$RELEASE_TOOLING_SHA:scripts/test_check_release_workflow.py" \
            > "$tooling_root/test_check_release_workflow.py"
          git cat-file blob "$RELEASE_TOOLING_SHA:scripts/workflow_yaml.py" \
            > "$tooling_root/workflow_yaml.py"
          git cat-file blob "$RELEASE_TOOLING_SHA:scripts/provision_ffmpeg_sidecars.py" \
            > "$tooling_root/provision_ffmpeg_sidecars.py"
          git cat-file blob "$RELEASE_TOOLING_SHA:scripts/tests/test_provision_ffmpeg_sidecars.py" \
            > "$tooling_root/test_provision_ffmpeg_sidecars.py"
          git cat-file blob "$RELEASE_TOOLING_SHA:.github/workflows/release.yml" \
            > "$tooling_root/release.yml"
          git cat-file blob "$RELEASE_TOOLING_SHA:docs/releases/1.0.0-beta.4.md" \
            > "$tooling_root/release-notes.md"
          test -s "$tooling_root/check_release_workflow.py"
          test -s "$tooling_root/test_check_release_workflow.py"
          test -s "$tooling_root/workflow_yaml.py"
          test -s "$tooling_root/provision_ffmpeg_sidecars.py"
          test -s "$tooling_root/test_provision_ffmpeg_sidecars.py"
          test -s "$tooling_root/release.yml"
          test -s "$tooling_root/release-notes.md"
          OPENTAKE_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
            OPENTAKE_RELEASE_WORKFLOW_PATH="$tooling_root/release.yml" \
            OPENTAKE_RELEASE_NOTES_PATH="$tooling_root/release-notes.md" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$tooling_root" \
            python3 -B "$tooling_root/check_release_workflow.py"
          OPENTAKE_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
            OPENTAKE_RELEASE_WORKFLOW_PATH="$tooling_root/release.yml" \
            OPENTAKE_RELEASE_NOTES_PATH="$tooling_root/release-notes.md" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$tooling_root" \
            python3 -B -m unittest discover -s "$tooling_root" \
            -p 'test_check_release_workflow.py'

      - name: Provisioner unit tests
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          tooling_root="$RUNNER_TEMP/opentake-release-tooling-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          OPENTAKE_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
            OPENTAKE_PROVISIONER_PATH="$tooling_root/provision_ffmpeg_sidecars.py" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$tooling_root" \
            python3 -B -m unittest discover \
            -s "$tooling_root" -p 'test_provision_ffmpeg_sidecars.py'

      - name: Install locked Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        env:
          OPENTAKE_MOTION_TRACE: '1'
        run: cargo test --workspace -- --test-threads=1

      - name: Live playback transport integration
        run: |
          set -euo pipefail
          cargo test -p opentake-tauri \
            --features playback-engine \
            --test playback_transport_integration \
            -- --test-threads=1

      - name: Minimal-feature Tauri clippy
        run: cargo clippy -p opentake-tauri --no-default-features --all-targets -- -D warnings

      - name: Web editor behavior suite
        run: pnpm -C web test

      - name: Web production build
        run: pnpm -C web build

      - name: Reassert exact source after quality gates
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test "$(git rev-parse "${actual}^{tree}")" = "$(git rev-parse "${expected}^{tree}")"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  macos_arm64:
    name: macOS ARM64 app and DMG
    needs: validate
    runs-on: macos-14
    timeout-minutes: 120
    env:
      TARGET_SHA: ${{ needs.validate.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      APPLE_SIGNING_IDENTITY: '-'
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Require updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'

      - name: Provision checksum-pinned ARM64 FFmpeg sidecars
        run: python3 scripts/provision_ffmpeg_sidecars.py --target aarch64-apple-darwin

      - name: Verify pinned sidecar supply
        run: ruby scripts/tests/packaged-sidecars-test.rb --name packaged_macos_windows_sidecars_resolve_and_execute

      - name: Install locked Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Reassert exact source before macOS build
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test "$(git rev-parse "${actual}^{tree}")" = "$(git rev-parse "${expected}^{tree}")"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Build ad-hoc Tauri app, DMG, and signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          ./web/node_modules/.bin/tauri build --ci
          --target aarch64-apple-darwin --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}'

      - name: Verify complete app, sidecars, DMG, and signed updater
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/aarch64-apple-darwin/release/bundle"
          test "$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')" -eq 1
          test "$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')" -eq 1
          app="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          updater="$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          updater_signature="$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz.sig' -print -quit)"
          test "$updater_signature" = "$updater.sig"
          test -s "$updater"
          test -s "$updater_signature"
          test -f "$app/Contents/MacOS/ffmpeg"
          test -f "$app/Contents/MacOS/ffprobe"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/ffmpeg"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/ffprobe"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'
          codesign -dv --verbose=4 "$app/Contents/MacOS/ffmpeg" 2>&1 | grep -F 'Signature=adhoc'
          codesign -dv --verbose=4 "$app/Contents/MacOS/ffprobe" 2>&1 | grep -F 'Signature=adhoc'
          hdiutil verify "$dmg"

          mountpoint="$RUNNER_TEMP/opentake-release-dmg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$mountpoint"
          cleanup() { hdiutil detach "$mountpoint" -force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          test "$(find "$mountpoint" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" -eq 1
          mounted_app="$(find "$mountpoint" -maxdepth 1 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          codesign --verify --strict --verbose=2 "$mounted_app/Contents/MacOS/ffmpeg"
          codesign --verify --strict --verbose=2 "$mounted_app/Contents/MacOS/ffprobe"
          ruby scripts/tests/packaged-sidecars-test.rb \
            --name packaged_macos_windows_sidecars_resolve_and_execute \
            --package "$mounted_app"
          cleanup
          trap - EXIT

      - name: Reassert exact source after macOS packaging
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test "$(git rev-parse "${actual}^{tree}")" = "$(git rev-parse "${expected}^{tree}")"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Create and sign macOS updater attestation
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="target/aarch64-apple-darwin/release/bundle/macos"
          test "$(find "$bundle_root" -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')" -eq 1
          updater="$(find "$bundle_root" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          attestation="$updater.attestation.json"
          python3 scripts/write_updater_attestation.py \
            --repository appergb/OpenTake \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --source-sha "$TARGET_SHA" \
            --platform darwin-aarch64 \
            --artifact "$updater" \
            --output "$attestation"
          ./web/node_modules/.bin/tauri signer sign "$attestation"
          test -s "$attestation"
          test -s "$attestation.sig"

      - name: Create macOS exact-SHA receipt
        env:
          RECEIPT_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          bundle = Path("target/aarch64-apple-darwin/release/bundle")
          dmgs = list((bundle / "dmg").glob("*.dmg"))
          updaters = list((bundle / "macos").glob("*.app.tar.gz"))
          signatures = list((bundle / "macos").glob("*.app.tar.gz.sig"))
          attestations = list((bundle / "macos").glob("*.app.tar.gz.attestation.json"))
          attestation_signatures = list(
              (bundle / "macos").glob("*.app.tar.gz.attestation.json.sig")
          )
          if (
              len(dmgs) != 1
              or len(updaters) != 1
              or len(signatures) != 1
              or len(attestations) != 1
              or len(attestation_signatures) != 1
          ):
              raise SystemExit("expected one DMG and one signed updater attestation set")
          if signatures[0] != Path(f"{updaters[0]}.sig"):
              raise SystemExit("macOS updater signature is not the archive companion")
          if attestations[0] != Path(f"{updaters[0]}.attestation.json"):
              raise SystemExit("macOS attestation is not the archive companion")
          if attestation_signatures[0] != Path(f"{attestations[0]}.sig"):
              raise SystemExit("macOS attestation signature is not its companion")
          artifacts = [
              {
                  "name": artifact.name,
                  "sha256": sha256(artifact),
                  "bytes": artifact.stat().st_size,
              }
              for artifact in (
                  dmgs[0],
                  updaters[0],
                  signatures[0],
                  attestations[0],
                  attestation_signatures[0],
              )
          ]
          receipt = {
              "schema": "opentake-macos-arm64-receipt-v2",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_sha": os.environ["RECEIPT_SHA"],
              "platform_signing_mode": "ad-hoc",
              "updater_signature_mode": "tauri-minisign",
              "artifacts": artifacts,
          }
          Path("macos-arm64-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload exact-SHA macOS packages and updater
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opentake-macos-arm64-${{ needs.validate.outputs.source_sha }}
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.attestation.json
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.attestation.json.sig
            macos-arm64-receipt.json
          if-no-files-found: error
          retention-days: 30

  windows_x64:
    name: Windows x64 MSI and NSIS
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TARGET_SHA: ${{ needs.validate.outputs.source_sha }}
      RELEASE_TOOLING_SHA: ${{ needs.validate.outputs.tooling_sha }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Require updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'

      - name: Provision checksum-pinned Windows FFmpeg sidecars
        shell: pwsh
        run: |
          if ($env:RELEASE_TOOLING_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'release tooling SHA must be lowercase 40-hex'
          }
          $toolingRoot = Join-Path $env:RUNNER_TEMP "opentake-sidecar-tooling-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $toolingRoot | Out-Null
          $provisioner = Join-Path $toolingRoot 'provision_ffmpeg_sidecars.py'
          git cat-file -e "$($env:RELEASE_TOOLING_SHA)^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags --depth=1 origin $env:RELEASE_TOOLING_SHA
            if ($LASTEXITCODE -ne 0) { throw 'failed to fetch exact release tooling commit' }
          }
          $resolvedTooling = (git rev-parse "$($env:RELEASE_TOOLING_SHA)^{commit}").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $resolvedTooling -ne $env:RELEASE_TOOLING_SHA) {
            throw 'release tooling commit did not resolve exactly'
          }
          git cat-file blob "$($env:RELEASE_TOOLING_SHA):scripts/provision_ffmpeg_sidecars.py" > $provisioner
          if ($LASTEXITCODE -ne 0) { throw 'failed to extract exact sidecar provisioner blob' }
          if (-not (Test-Path $provisioner -PathType Leaf) -or (Get-Item $provisioner).Length -le 0) {
            throw 'release sidecar provisioner blob is missing or empty'
          }
          $env:OPENTAKE_REPOSITORY_ROOT = $env:GITHUB_WORKSPACE
          python $provisioner --target x86_64-pc-windows-msvc

      - name: Verify pinned sidecar supply
        shell: bash
        run: ruby scripts/tests/packaged-sidecars-test.rb --name packaged_macos_windows_sidecars_resolve_and_execute

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-windows-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: release-windows-cargo-

      - name: Install locked Web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Rust workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        env:
          OPENTAKE_MOTION_TRACE: '1'
        run: cargo test --workspace -- --test-threads=1

      - name: Web editor behavior suite
        run: pnpm -C web test

      - name: Minimal-feature Tauri clippy
        run: cargo clippy -p opentake-tauri --no-default-features --all-targets -- -D warnings

      - name: Web production build
        run: pnpm -C web build

      - name: Reassert exact source before Windows build
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test "$(git rev-parse "${actual}^{tree}")" = "$(git rev-parse "${expected}^{tree}")"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Build native MSI, NSIS, and signed updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item 'target/release/bundle/msi' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'target/release/bundle/nsis' -Recurse -Force -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw 'RUNNER_TEMP is required' }
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $configPath = Join-Path $env:RUNNER_TEMP "opentake-windows-updater-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          $configPath = [System.IO.Path]::GetFullPath($configPath)
          if (-not [System.IO.Path]::IsPathFullyQualified($configPath)) { throw 'Tauri config path is not absolute' }
          if (-not [string]::Equals([System.IO.Path]::GetDirectoryName($configPath), $runnerTemp, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Tauri config path escaped RUNNER_TEMP'
          }
          if (Test-Path -LiteralPath $configPath) { throw 'Tauri config path already exists' }
          $configJson = '{"bundle":{"createUpdaterArtifacts":true}}'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($configPath, $configJson, $utf8NoBom)
          $configItem = Get-Item -LiteralPath $configPath -Force
          if ($configItem.PSIsContainer -or (($configItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0)) {
            throw 'Tauri config must be a regular non-link file'
          }
          $configBytes = [System.IO.File]::ReadAllBytes($configPath)
          if ($configBytes.Length -ne $utf8NoBom.GetByteCount($configJson)) { throw 'Tauri config is not exact UTF-8 without BOM' }
          $configText = [System.IO.File]::ReadAllText($configPath, [System.Text.Encoding]::UTF8)
          if ($configText -cne $configJson) { throw 'Tauri config content changed' }
          $parsedConfig = [System.IO.File]::ReadAllText($configPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json -AsHashtable
          if (@($parsedConfig.Keys).Count -ne 1 -or -not ($parsedConfig.Keys -ccontains 'bundle')) { throw 'Tauri config root is not exact' }
          $bundleConfig = $parsedConfig['bundle']
          if (-not ($bundleConfig -is [System.Collections.IDictionary]) -or @($bundleConfig.Keys).Count -ne 1 -or -not ($bundleConfig.Keys -ccontains 'createUpdaterArtifacts')) {
            throw 'Tauri bundle config is not exact'
          }
          if (-not ($bundleConfig['createUpdaterArtifacts'] -is [bool]) -or $bundleConfig['createUpdaterArtifacts'] -ne $true) {
            throw 'Tauri updater artifact config must be true'
          }
          $tauriArguments = @(
            'build'
            '--ci'
            '--bundles'
            'msi,nsis'
            '--config'
            $configPath
          )
          $tauriExitCode = $null
          try {
            & .\web\node_modules\.bin\tauri.cmd @tauriArguments
            $tauriExitCode = $LASTEXITCODE
          } finally {
            if (Test-Path -LiteralPath $configPath) {
              Remove-Item -LiteralPath $configPath -Force
            }
          }
          if ($tauriExitCode -ne 0) { exit $tauriExitCode }

      - name: Install NSIS and smoke installed app, sidecars, and updater artifacts
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem 'target/release/bundle/msi/*.msi' -File)
          $installer = @(Get-ChildItem 'target/release/bundle/nsis/*.exe' -File)
          $msiSignature = @(Get-ChildItem 'target/release/bundle/msi/*.msi.sig' -File)
          $nsisSignature = @(Get-ChildItem 'target/release/bundle/nsis/*.exe.sig' -File)
          if ($msi.Count -ne 1) { throw 'expected exactly one MSI installer' }
          if ($installer.Count -ne 1) { throw 'expected exactly one NSIS installer' }
          if ($msiSignature.Count -ne 1) { throw 'expected exactly one MSI updater signature' }
          if ($nsisSignature.Count -ne 1) { throw 'expected exactly one NSIS updater signature' }
          if ($msiSignature[0].FullName -ne "$($msi[0].FullName).sig") { throw 'MSI signature is not the installer companion' }
          if ($nsisSignature[0].FullName -ne "$($installer[0].FullName).sig") { throw 'NSIS signature is not the installer companion' }
          if ($msiSignature[0].Length -le 0 -or $nsisSignature[0].Length -le 0) { throw 'updater signature is empty' }
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "silent NSIS install failed: $($install.ExitCode)" }
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'OpenTake/opentake.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs/OpenTake/opentake.exe'),
            (Join-Path $env:ProgramFiles 'OpenTake/opentake.exe')
          )
          $application = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $application) {
            $uninstall = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' `
              -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'OpenTake' } | Select-Object -First 1
            if ($uninstall.InstallLocation) {
              $application = Get-ChildItem $uninstall.InstallLocation -Filter 'opentake.exe' -File `
                -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
            }
          }
          if (-not $application) { throw "installed OpenTake executable not found: $($candidates -join ', ')" }
          $installDirectory = Split-Path -Parent $application
          ruby scripts/tests/packaged-sidecars-test.rb `
            --name packaged_macos_windows_sidecars_resolve_and_execute `
            --package $installDirectory
          $app = Start-Process -FilePath $application -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "installed OpenTake exited during launch smoke test: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Wait-Process -Id $app.Id -ErrorAction SilentlyContinue

      - name: Reassert exact source after Windows packaging
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test "$(git rev-parse "${actual}^{tree}")" = "$(git rev-parse "${expected}^{tree}")"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Create and sign Windows updater attestations
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $msi = @(Get-ChildItem 'target/release/bundle/msi/*.msi' -File)
          $nsis = @(Get-ChildItem 'target/release/bundle/nsis/*.exe' -File)
          if ($msi.Count -ne 1) { throw 'expected exactly one MSI updater' }
          if ($nsis.Count -ne 1) { throw 'expected exactly one NSIS updater' }
          $msiAttestation = "$($msi[0].FullName).attestation.json"
          python scripts/write_updater_attestation.py `
            --repository appergb/OpenTake `
            --tag $env:RELEASE_TAG `
            --version $env:RELEASE_VERSION `
            --source-sha $env:TARGET_SHA `
            --platform windows-x86_64-msi `
            --artifact $msi[0].FullName `
            --output $msiAttestation
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSI updater attestation generation failed' }
          & .\web\node_modules\.bin\tauri.cmd signer sign $msiAttestation
          if ($LASTEXITCODE -ne 0) { throw 'Windows MSI updater attestation signing failed' }
          $nsisAttestation = "$($nsis[0].FullName).attestation.json"
          python scripts/write_updater_attestation.py `
            --repository appergb/OpenTake `
            --tag $env:RELEASE_TAG `
            --version $env:RELEASE_VERSION `
            --source-sha $env:TARGET_SHA `
            --platform windows-x86_64-nsis `
            --artifact $nsis[0].FullName `
            --output $nsisAttestation
          if ($LASTEXITCODE -ne 0) { throw 'Windows NSIS updater attestation generation failed' }
          & .\web\node_modules\.bin\tauri.cmd signer sign $nsisAttestation
          if ($LASTEXITCODE -ne 0) { throw 'Windows NSIS updater attestation signing failed' }
          foreach ($attestation in @($msiAttestation, $nsisAttestation)) {
            if (-not (Test-Path $attestation -PathType Leaf)) { throw "Windows updater attestation is missing: $attestation" }
            if (-not (Test-Path "$attestation.sig" -PathType Leaf)) { throw "Windows updater attestation signature is missing: $attestation.sig" }
          }

      - name: Create Windows exact-SHA receipt
        shell: pwsh
        env:
          RECEIPT_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          $msi = @(Get-ChildItem 'target/release/bundle/msi/*.msi' -File)
          $nsis = @(Get-ChildItem 'target/release/bundle/nsis/*.exe' -File)
          $msiSignature = @(Get-ChildItem 'target/release/bundle/msi/*.msi.sig' -File)
          $nsisSignature = @(Get-ChildItem 'target/release/bundle/nsis/*.exe.sig' -File)
          $msiAttestation = @(Get-ChildItem 'target/release/bundle/msi/*.msi.attestation.json' -File)
          $msiAttestationSignature = @(Get-ChildItem 'target/release/bundle/msi/*.msi.attestation.json.sig' -File)
          $nsisAttestation = @(Get-ChildItem 'target/release/bundle/nsis/*.exe.attestation.json' -File)
          $nsisAttestationSignature = @(Get-ChildItem 'target/release/bundle/nsis/*.exe.attestation.json.sig' -File)
          if ($msi.Count -ne 1) { throw 'expected exactly one MSI installer' }
          if ($nsis.Count -ne 1) { throw 'expected exactly one NSIS installer' }
          if ($msiSignature.Count -ne 1) { throw 'expected exactly one MSI updater signature' }
          if ($nsisSignature.Count -ne 1) { throw 'expected exactly one NSIS updater signature' }
          if ($msiAttestation.Count -ne 1) { throw 'expected exactly one MSI updater attestation' }
          if ($msiAttestationSignature.Count -ne 1) { throw 'expected exactly one MSI attestation signature' }
          if ($nsisAttestation.Count -ne 1) { throw 'expected exactly one NSIS updater attestation' }
          if ($nsisAttestationSignature.Count -ne 1) { throw 'expected exactly one NSIS attestation signature' }
          if ($msiSignature[0].FullName -ne "$($msi[0].FullName).sig") { throw 'MSI signature is not the installer companion' }
          if ($nsisSignature[0].FullName -ne "$($nsis[0].FullName).sig") { throw 'NSIS signature is not the installer companion' }
          if ($msiAttestation[0].FullName -ne "$($msi[0].FullName).attestation.json") { throw 'MSI attestation is not the installer companion' }
          if ($msiAttestationSignature[0].FullName -ne "$($msiAttestation[0].FullName).sig") { throw 'MSI attestation signature is not its companion' }
          if ($nsisAttestation[0].FullName -ne "$($nsis[0].FullName).attestation.json") { throw 'NSIS attestation is not the installer companion' }
          if ($nsisAttestationSignature[0].FullName -ne "$($nsisAttestation[0].FullName).sig") { throw 'NSIS attestation signature is not its companion' }
          $artifacts = @($msi + $nsis + $msiSignature + $nsisSignature + $msiAttestation + $msiAttestationSignature + $nsisAttestation + $nsisAttestationSignature) | ForEach-Object {
            [ordered]@{
              name = $_.Name
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = $_.Length
            }
          }
          $receipt = [ordered]@{
            schema = 'opentake-windows-release-receipt-v2'
            repository = '${{ github.repository }}'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            source_sha = $env:RECEIPT_SHA
            platform_signing_mode = 'unsigned-authenticode'
            updater_signature_mode = 'tauri-minisign'
            artifacts = @($artifacts)
          }
          $receipt | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM windows-x64-receipt.json

      - name: Upload exact-SHA Windows packages and updater signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opentake-windows-x64-${{ needs.validate.outputs.source_sha }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/msi/*.msi.attestation.json
            target/release/bundle/msi/*.msi.attestation.json.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/nsis/*.exe.attestation.json
            target/release/bundle/nsis/*.exe.attestation.json.sig
            windows-x64-receipt.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified GitHub prerelease
    permissions:
      contents: write
    needs: [validate, quality, macos_arm64, windows_x64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.source_sha }}
      RELEASE_TOOLING_SHA: ${{ needs.validate.outputs.tooling_sha }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      NOTES_PATH: ${{ needs.validate.outputs.notes_path }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$RELEASE_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Initialize isolated publish root
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          publish_root="$RUNNER_TEMP/opentake-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          case "$publish_root" in
            "$RUNNER_TEMP"/opentake-release-*) ;;
            *) exit 1 ;;
          esac
          printf 'PUBLISH_ROOT=%s\n' "$publish_root" >> "$GITHUB_ENV"

      - name: Install Minisign verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          command -v minisign >/dev/null

      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opentake-macos-arm64-${{ needs.validate.outputs.source_sha }}
          path: ${{ runner.temp }}/opentake-release-${{ github.run_id }}-${{ github.run_attempt }}/input/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opentake-windows-x64-${{ needs.validate.outputs.source_sha }}
          path: ${{ runner.temp }}/opentake-release-${{ github.run_id }}-${{ github.run_attempt }}/input/windows

      - name: Stage and verify the exact release payload
        shell: bash
        run: |
          set -euo pipefail
          case "$PUBLISH_ROOT" in
            "$RUNNER_TEMP"/opentake-release-*) ;;
            *) echo "publish root must be under RUNNER_TEMP" >&2; exit 1 ;;
          esac
          mapfile -d '' dmgs < <(find "$PUBLISH_ROOT/input/macos" -type f -name '*.dmg' -print0)
          mapfile -d '' mac_updaters < <(find "$PUBLISH_ROOT/input/macos" -type f -name '*.app.tar.gz' -print0)
          mapfile -d '' mac_signatures < <(find "$PUBLISH_ROOT/input/macos" -type f -name '*.app.tar.gz.sig' -print0)
          mapfile -d '' mac_attestations < <(find "$PUBLISH_ROOT/input/macos" -type f -name '*.app.tar.gz.attestation.json' -print0)
          mapfile -d '' mac_attestation_signatures < <(find "$PUBLISH_ROOT/input/macos" -type f -name '*.app.tar.gz.attestation.json.sig' -print0)
          mapfile -d '' msis < <(find "$PUBLISH_ROOT/input/windows" -type f -name '*.msi' -print0)
          mapfile -d '' exes < <(find "$PUBLISH_ROOT/input/windows" -type f -name '*.exe' -print0)
          mapfile -d '' windows_signatures < <(find "$PUBLISH_ROOT/input/windows" -type f \( -name '*.msi.sig' -o -name '*.exe.sig' \) -print0)
          mapfile -d '' msi_attestations < <(find "$PUBLISH_ROOT/input/windows" -type f -name '*.msi.attestation.json' -print0)
          mapfile -d '' msi_attestation_signatures < <(find "$PUBLISH_ROOT/input/windows" -type f -name '*.msi.attestation.json.sig' -print0)
          mapfile -d '' nsis_attestations < <(find "$PUBLISH_ROOT/input/windows" -type f -name '*.exe.attestation.json' -print0)
          mapfile -d '' nsis_attestation_signatures < <(find "$PUBLISH_ROOT/input/windows" -type f -name '*.exe.attestation.json.sig' -print0)
          mapfile -d '' mac_receipts < <(find "$PUBLISH_ROOT/input/macos" -type f -name 'macos-arm64-receipt.json' -print0)
          mapfile -d '' windows_receipts < <(find "$PUBLISH_ROOT/input/windows" -type f -name 'windows-x64-receipt.json' -print0)
          test "${#dmgs[@]}" -eq 1
          test "${#mac_updaters[@]}" -eq 1
          test "${#mac_signatures[@]}" -eq 1
          test "${#mac_attestations[@]}" -eq 1
          test "${#mac_attestation_signatures[@]}" -eq 1
          test "${#msis[@]}" -eq 1
          test "${#exes[@]}" -eq 1
          test "${#windows_signatures[@]}" -eq 2
          test "${#msi_attestations[@]}" -eq 1
          test "${#msi_attestation_signatures[@]}" -eq 1
          test "${#nsis_attestations[@]}" -eq 1
          test "${#nsis_attestation_signatures[@]}" -eq 1
          test "${#mac_receipts[@]}" -eq 1
          test "${#windows_receipts[@]}" -eq 1
          mkdir -p "$PUBLISH_ROOT/assets"
          cp "${dmgs[0]}" "${mac_updaters[0]}" "${mac_signatures[0]}" "$PUBLISH_ROOT/assets/"
          cp "${mac_attestations[0]}" "${mac_attestation_signatures[0]}" "$PUBLISH_ROOT/assets/"
          cp "${msis[0]}" "${exes[0]}" "${windows_signatures[@]}" "$PUBLISH_ROOT/assets/"
          cp "${msi_attestations[0]}" "${msi_attestation_signatures[0]}" "$PUBLISH_ROOT/assets/"
          cp "${nsis_attestations[0]}" "${nsis_attestation_signatures[0]}" "$PUBLISH_ROOT/assets/"
          cp "${mac_receipts[0]}" "$PUBLISH_ROOT/assets/macos-arm64-receipt.json"
          cp "${windows_receipts[0]}" "$PUBLISH_ROOT/assets/windows-x64-receipt.json"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          root = Path(os.environ["PUBLISH_ROOT"]) / "assets"
          files = [path for path in root.iterdir() if path.is_file()]
          dmgs = [path for path in files if path.name.endswith(".dmg")]
          mac_updaters = [path for path in files if path.name.endswith(".app.tar.gz")]
          mac_signatures = [path for path in files if path.name.endswith(".app.tar.gz.sig")]
          mac_attestations = [
              path for path in files
              if path.name.endswith(".app.tar.gz.attestation.json")
          ]
          mac_attestation_signatures = [
              path for path in files
              if path.name.endswith(".app.tar.gz.attestation.json.sig")
          ]
          msis = [path for path in files if path.name.endswith(".msi")]
          exes = [path for path in files if path.name.endswith(".exe")]
          windows_signatures = [
              path for path in files
              if path.name.endswith(".msi.sig") or path.name.endswith(".exe.sig")
          ]
          msi_attestations = [
              path for path in files if path.name.endswith(".msi.attestation.json")
          ]
          msi_attestation_signatures = [
              path for path in files
              if path.name.endswith(".msi.attestation.json.sig")
          ]
          nsis_attestations = [
              path for path in files if path.name.endswith(".exe.attestation.json")
          ]
          nsis_attestation_signatures = [
              path for path in files
              if path.name.endswith(".exe.attestation.json.sig")
          ]
          receipts = [path for path in files if path.name.endswith("-receipt.json")]
          counts = tuple(
              len(group)
              for group in (
                  dmgs,
                  mac_updaters,
                  mac_signatures,
                  mac_attestations,
                  mac_attestation_signatures,
                  msis,
                  exes,
                  windows_signatures,
                  msi_attestations,
                  msi_attestation_signatures,
                  nsis_attestations,
                  nsis_attestation_signatures,
                  receipts,
              )
          )
          if counts != (1, 1, 1, 1, 1, 1, 1, 2, 1, 1, 1, 1, 2) or len(files) != 15:
              raise SystemExit(f"unexpected staged release payload counts: {counts}")
          if mac_signatures[0] != Path(f"{mac_updaters[0]}.sig"):
              raise SystemExit("macOS updater signature is not the archive companion")
          if {path.name for path in windows_signatures} != {
              f"{msis[0].name}.sig",
              f"{exes[0].name}.sig",
          }:
              raise SystemExit("Windows updater signatures are not installer companions")

          if mac_attestations[0] != Path(f"{mac_updaters[0]}.attestation.json"):
              raise SystemExit("macOS attestation is not the updater companion")
          if mac_attestation_signatures[0] != Path(f"{mac_attestations[0]}.sig"):
              raise SystemExit("macOS attestation signature is not its companion")
          if msi_attestations[0] != Path(f"{msis[0]}.attestation.json"):
              raise SystemExit("MSI attestation is not the updater companion")
          if msi_attestation_signatures[0] != Path(f"{msi_attestations[0]}.sig"):
              raise SystemExit("MSI attestation signature is not its companion")
          if nsis_attestations[0] != Path(f"{exes[0]}.attestation.json"):
              raise SystemExit("NSIS attestation is not the updater companion")
          if nsis_attestation_signatures[0] != Path(
              f"{nsis_attestations[0]}.sig"
          ):
              raise SystemExit("NSIS attestation signature is not its companion")

          source_sha = os.environ["RELEASE_SHA"]
          release_tag = os.environ["RELEASE_TAG"]
          release_version = os.environ["RELEASE_VERSION"]

          attestation_keys = {
              "schemaVersion",
              "repository",
              "tag",
              "version",
              "sourceSha",
              "platform",
              "assetName",
              "size",
              "sha256",
          }

          def verify_attestation(
              path: Path,
              artifact: Path,
              platform: str,
          ) -> None:
              attestation = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(attestation, dict) or set(attestation) != attestation_keys:
                  raise SystemExit(f"attestation fields are not exact: {path.name}")
              string_fields = (
                  "repository",
                  "tag",
                  "version",
                  "sourceSha",
                  "platform",
                  "assetName",
                  "sha256",
              )
              if (
                  type(attestation["schemaVersion"]) is not int
                  or type(attestation["size"]) is not int
                  or attestation["size"] <= 0
                  or any(type(attestation[field]) is not str for field in string_fields)
              ):
                  raise SystemExit(f"attestation field types are invalid: {path.name}")
              expected = {
                  "schemaVersion": 1,
                  "repository": "appergb/OpenTake",
                  "tag": release_tag,
                  "version": release_version,
                  "sourceSha": source_sha,
                  "platform": platform,
                  "assetName": artifact.name,
                  "size": artifact.stat().st_size,
                  "sha256": sha256(artifact),
              }
              if attestation.get("sourceSha") != source_sha:
                  raise SystemExit(f"attestation source SHA mismatch: {path.name}")
              if attestation.get("sha256") != sha256(artifact):
                  raise SystemExit(f"attestation payload checksum mismatch: {path.name}")
              if attestation != expected:
                  raise SystemExit(f"attestation identity mismatch: {path.name}")
              canonical = json.dumps(
                  expected, sort_keys=True, separators=(",", ":")
              ) + "\n"
              if path.read_text(encoding="utf-8") != canonical:
                  raise SystemExit(f"attestation is not canonical JSON: {path.name}")

          verify_attestation(
              mac_attestations[0], mac_updaters[0], "darwin-aarch64"
          )
          verify_attestation(
              msi_attestations[0], msis[0], "windows-x86_64-msi"
          )
          verify_attestation(
              nsis_attestations[0], exes[0], "windows-x86_64-nsis"
          )

          def verify_receipt(
              filename: str,
              schema: str,
              expected_artifacts: list[Path],
              platform_signing_mode: str,
          ) -> None:
              receipt = json.loads((root / filename).read_text(encoding="utf-8"))
              if receipt.get("schema") != schema:
                  raise SystemExit(f"release receipt schema mismatch: {filename}")
              if receipt.get("repository") != "appergb/OpenTake":
                  raise SystemExit(f"release receipt repository mismatch: {filename}")
              if receipt.get("source_sha") != source_sha:
                  raise SystemExit(f"release receipt source SHA mismatch: {filename}")
              if receipt.get("platform_signing_mode") != platform_signing_mode:
                  raise SystemExit(f"platform signing claim mismatch: {filename}")
              if receipt.get("updater_signature_mode") != "tauri-minisign":
                  raise SystemExit(f"updater signing claim mismatch: {filename}")
              entries = receipt.get("artifacts")
              if not isinstance(entries, list) or len(entries) != len(expected_artifacts):
                  raise SystemExit(f"release receipt artifact count mismatch: {filename}")
              by_name = {entry.get("name"): entry for entry in entries}
              if len(by_name) != len(entries):
                  raise SystemExit(f"release receipt contains duplicate names: {filename}")
              if set(by_name) != {artifact.name for artifact in expected_artifacts}:
                  raise SystemExit(f"release receipt artifact names mismatch: {filename}")
              for artifact in expected_artifacts:
                  entry = by_name[artifact.name]
                  if entry.get("sha256") != sha256(artifact):
                      raise SystemExit(f"release receipt checksum mismatch: {artifact.name}")
                  if entry.get("bytes") != artifact.stat().st_size:
                      raise SystemExit(f"release receipt byte count mismatch: {artifact.name}")

          verify_receipt(
              "macos-arm64-receipt.json",
              "opentake-macos-arm64-receipt-v2",
              [
                  dmgs[0],
                  mac_updaters[0],
                  mac_signatures[0],
                  mac_attestations[0],
                  mac_attestation_signatures[0],
              ],
              "ad-hoc",
          )
          verify_receipt(
              "windows-x64-receipt.json",
              "opentake-windows-release-receipt-v2",
              [
                  msis[0],
                  exes[0],
                  *windows_signatures,
                  msi_attestations[0],
                  msi_attestation_signatures[0],
                  nsis_attestations[0],
                  nsis_attestation_signatures[0],
              ],
              "unsigned-authenticode",
          )
          PY

      - name: Verify updater signatures against embedded public key
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' mac_updaters < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.app.tar.gz' -print0)
          mapfile -d '' mac_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.app.tar.gz.sig' -print0)
          mapfile -d '' mac_attestations < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.app.tar.gz.attestation.json' -print0)
          mapfile -d '' mac_attestation_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.app.tar.gz.attestation.json.sig' -print0)
          mapfile -d '' msis < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.msi' -print0)
          mapfile -d '' msi_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.msi.sig' -print0)
          mapfile -d '' msi_attestations < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.msi.attestation.json' -print0)
          mapfile -d '' msi_attestation_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.msi.attestation.json.sig' -print0)
          mapfile -d '' exes < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.exe' -print0)
          mapfile -d '' exe_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.exe.sig' -print0)
          mapfile -d '' nsis_attestations < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.exe.attestation.json' -print0)
          mapfile -d '' nsis_attestation_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.exe.attestation.json.sig' -print0)
          test "${#mac_updaters[@]}" -eq 1
          test "${#mac_signatures[@]}" -eq 1
          test "${#mac_attestations[@]}" -eq 1
          test "${#mac_attestation_signatures[@]}" -eq 1
          test "${#msis[@]}" -eq 1
          test "${#msi_signatures[@]}" -eq 1
          test "${#msi_attestations[@]}" -eq 1
          test "${#msi_attestation_signatures[@]}" -eq 1
          test "${#exes[@]}" -eq 1
          test "${#exe_signatures[@]}" -eq 1
          test "${#nsis_attestations[@]}" -eq 1
          test "${#nsis_attestation_signatures[@]}" -eq 1
          test "${mac_signatures[0]}" = "${mac_updaters[0]}.sig"
          test "${msi_signatures[0]}" = "${msis[0]}.sig"
          test "${exe_signatures[0]}" = "${exes[0]}.sig"
          test "${mac_attestations[0]}" = "${mac_updaters[0]}.attestation.json"
          test "${mac_attestation_signatures[0]}" = "${mac_attestations[0]}.sig"
          test "${msi_attestations[0]}" = "${msis[0]}.attestation.json"
          test "${msi_attestation_signatures[0]}" = "${msi_attestations[0]}.sig"
          test "${nsis_attestations[0]}" = "${exes[0]}.attestation.json"
          test "${nsis_attestation_signatures[0]}" = "${nsis_attestations[0]}.sig"

          verification_root="$PUBLISH_ROOT/signature-verification"
          mkdir -p "$verification_root"
          python3 - "$verification_root" \
            "${mac_signatures[0]}" "${msi_signatures[0]}" "${exe_signatures[0]}" \
            "${mac_attestation_signatures[0]}" "${msi_attestation_signatures[0]}" \
            "${nsis_attestation_signatures[0]}" <<'PY'
          import base64
          import binascii
          import json
          from pathlib import Path
          import sys

          verification_root = Path(sys.argv[1])
          signature_sources = [Path(value) for value in sys.argv[2:]]
          config = json.loads(
              Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )
          pubkey = config["plugins"]["updater"]["pubkey"]
          if not isinstance(pubkey, str) or not pubkey:
              raise SystemExit("embedded updater public key is missing")

          def decode_base64(value: str, kind: str) -> bytes:
              try:
                  return base64.b64decode(value, validate=True)
              except (binascii.Error, ValueError) as error:
                  raise SystemExit(f"{kind} is not canonical base64") from error

          public_key = decode_base64(pubkey, "embedded updater public key")
          try:
              public_lines = public_key.decode("utf-8").splitlines()
          except UnicodeError as error:
              raise SystemExit("embedded updater public key is not UTF-8") from error
          if (
              len(public_lines) != 2
              or not public_lines[0].startswith(
                  "untrusted comment: minisign public key: "
              )
              or not public_lines[1].startswith("RW")
          ):
              raise SystemExit("embedded updater public key is not Minisign armor")
          (verification_root / "updater.pub").write_bytes(public_key)

          decoded_names = (
              "macos.sig",
              "msi.sig",
              "nsis.sig",
              "macos-attestation.sig",
              "msi-attestation.sig",
              "nsis-attestation.sig",
          )
          for source, decoded_name in zip(
              signature_sources, decoded_names, strict=True
          ):
              encoded = source.read_text(encoding="utf-8").strip()
              signature = decode_base64(encoded, f"updater signature {source.name}")
              try:
                  signature_lines = signature.decode("utf-8").splitlines()
              except UnicodeError as error:
                  raise SystemExit(
                      f"updater signature is not UTF-8: {source.name}"
                  ) from error
              if (
                  len(signature_lines) != 4
                  or not signature_lines[0].startswith("untrusted comment: ")
                  or not signature_lines[2].startswith("trusted comment: ")
              ):
                  raise SystemExit(
                      f"updater signature is not Minisign armor: {source.name}"
                  )
              (verification_root / decoded_name).write_bytes(signature)
          PY

          minisign -Vm "${mac_updaters[0]}" \
            -p "$verification_root/updater.pub" -x "$verification_root/macos.sig"
          minisign -Vm "${msis[0]}" \
            -p "$verification_root/updater.pub" -x "$verification_root/msi.sig"
          minisign -Vm "${exes[0]}" \
            -p "$verification_root/updater.pub" -x "$verification_root/nsis.sig"
          minisign -Vm "${mac_attestations[0]}" \
            -p "$verification_root/updater.pub" -x "$verification_root/macos-attestation.sig"
          minisign -Vm "${msi_attestations[0]}" \
            -p "$verification_root/updater.pub" -x "$verification_root/msi-attestation.sig"
          minisign -Vm "${nsis_attestations[0]}" \
            -p "$verification_root/updater.pub" -x "$verification_root/nsis-attestation.sig"

      - name: Write and verify tag-specific updater manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' mac_updaters < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.app.tar.gz' -print0)
          mapfile -d '' mac_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.app.tar.gz.sig' -print0)
          mapfile -d '' mac_attestations < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.app.tar.gz.attestation.json' -print0)
          mapfile -d '' mac_attestation_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.app.tar.gz.attestation.json.sig' -print0)
          mapfile -d '' msi_installers < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.msi' -print0)
          mapfile -d '' msi_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.msi.sig' -print0)
          mapfile -d '' msi_attestations < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.msi.attestation.json' -print0)
          mapfile -d '' msi_attestation_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.msi.attestation.json.sig' -print0)
          mapfile -d '' nsis_installers < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.exe' -print0)
          mapfile -d '' nsis_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.exe.sig' -print0)
          mapfile -d '' nsis_attestations < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.exe.attestation.json' -print0)
          mapfile -d '' nsis_attestation_signatures < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name '*.exe.attestation.json.sig' -print0)
          test "${#mac_updaters[@]}" -eq 1
          test "${#mac_signatures[@]}" -eq 1
          test "${#mac_attestations[@]}" -eq 1
          test "${#mac_attestation_signatures[@]}" -eq 1
          test "${#msi_installers[@]}" -eq 1
          test "${#msi_signatures[@]}" -eq 1
          test "${#msi_attestations[@]}" -eq 1
          test "${#msi_attestation_signatures[@]}" -eq 1
          test "${#nsis_installers[@]}" -eq 1
          test "${#nsis_signatures[@]}" -eq 1
          test "${#nsis_attestations[@]}" -eq 1
          test "${#nsis_attestation_signatures[@]}" -eq 1
          python3 scripts/write_updater_manifest.py \
            --repository appergb/OpenTake \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SHA" \
            --darwin-artifact "${mac_updaters[0]}" \
            --darwin-signature "${mac_signatures[0]}" \
            --darwin-attestation "${mac_attestations[0]}" \
            --darwin-attestation-signature "${mac_attestation_signatures[0]}" \
            --windows-msi-artifact "${msi_installers[0]}" \
            --windows-msi-signature "${msi_signatures[0]}" \
            --windows-msi-attestation "${msi_attestations[0]}" \
            --windows-msi-attestation-signature "${msi_attestation_signatures[0]}" \
            --windows-nsis-artifact "${nsis_installers[0]}" \
            --windows-nsis-signature "${nsis_signatures[0]}" \
            --windows-nsis-attestation "${nsis_attestations[0]}" \
            --windows-nsis-attestation-signature "${nsis_attestation_signatures[0]}" \
            --output "$PUBLISH_ROOT/assets/updater-$RELEASE_TAG.json"
          mapfile -d '' manifests < <(find "$PUBLISH_ROOT/assets" -maxdepth 1 -type f -name 'updater-v*.json' -print0)
          test "${#manifests[@]}" -eq 1
          test "${manifests[0]}" = "$PUBLISH_ROOT/assets/updater-$RELEASE_TAG.json"

      - name: Create and verify SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd "$PUBLISH_ROOT/assets"
          mapfile -t asset_names < <(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          payload_names=("${asset_names[@]}")
          test "${#payload_names[@]}" -eq 16
          sha256sum "${payload_names[@]}" > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" -eq 16
          sha256sum --check SHA256SUMS
          printf '%s\n' "${payload_names[@]}" SHA256SUMS | LC_ALL=C sort > "$PUBLISH_ROOT/expected-assets.txt"
          test "$(wc -l < "$PUBLISH_ROOT/expected-assets.txt" | tr -d ' ')" -eq 17

      - name: Prepare release notes with provenance
        shell: bash
        run: |
          set -euo pipefail
          notes_sha="$RELEASE_SHA"
          if [[ "$RELEASE_TOOLING_SHA" = "$RELEASE_SHA" ]]; then
            cp "$NOTES_PATH" "$PUBLISH_ROOT/release-body.md"
          else
            [[ "$RELEASE_TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "${RELEASE_TOOLING_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$RELEASE_TOOLING_SHA"
            fi
            test "$(git rev-parse "${RELEASE_TOOLING_SHA}^{commit}")" = "$RELEASE_TOOLING_SHA"
            git cat-file blob "$RELEASE_TOOLING_SHA:$NOTES_PATH" \
              > "$PUBLISH_ROOT/release-body.md"
            notes_sha="$RELEASE_TOOLING_SHA"
          fi
          test -s "$PUBLISH_ROOT/release-body.md"
          cat >> "$PUBLISH_ROOT/release-body.md" <<EOF

          ## Automated release provenance

          - Source commit: \`$RELEASE_SHA\`
          - Release tooling commit: \`$RELEASE_TOOLING_SHA\`
          - Release notes commit: \`$notes_sha\`
          - GitHub Actions run: [$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Updater trust: updater packages are signed with the dedicated Tauri updater key; the private key is supplied only from GitHub Actions secrets and is never published.
          - Platform signing limits: the macOS app uses ad-hoc signing only; it is not Developer ID signed or notarized. Windows installers are not Authenticode-signed.
          EOF

      - name: Reassert exact source before draft mutation
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test "$(git rev-parse "${actual}^{tree}")" = "$(git rev-parse "${expected}^{tree}")"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Revalidate remote tag before draft mutation
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" \
            > "$PUBLISH_ROOT/remote-tag-before-draft.txt"
          python3 scripts/check_release_workflow.py resolve-remote-tag \
            --input "$PUBLISH_ROOT/remote-tag-before-draft.txt" \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

      - name: Create or refresh draft prerelease
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId tagName tagCommit{oid} isDraft isPrerelease releaseAssets(first:100){nodes{id name size} pageInfo{hasNextPage}}}}}'
          gh api graphql \
            -f query="$query" -f owner="$owner" -f name="$repository" -f tag="$RELEASE_TAG" \
            > "$PUBLISH_ROOT/existing-release-graphql.json"
          python3 scripts/check_release_workflow.py resolve-release-state \
            --input "$PUBLISH_ROOT/existing-release-graphql.json" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --output "$PUBLISH_ROOT/release-state.json"
          action="$(jq -r '.action' "$PUBLISH_ROOT/release-state.json")"
          case "$action" in
            create)
              gh release create "$RELEASE_TAG" \
                --verify-tag \
                --target "$RELEASE_SHA" \
                --title "OpenTake $RELEASE_VERSION" \
                --notes-file "$PUBLISH_ROOT/release-body.md" \
                --draft --prerelease --latest=false
              ;;
            refresh)
              release_id="$(jq -r '.release_id' "$PUBLISH_ROOT/release-state.json")"
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$PUBLISH_ROOT/existing-draft-rest.json"
              test "$(jq -r '.id' "$PUBLISH_ROOT/existing-draft-rest.json")" = "$release_id"
              if test "$(jq -r '.draft' "$PUBLISH_ROOT/existing-draft-rest.json")" != "true"; then
                echo "release is already published; refusing to mutate it" >&2
                exit 1
              fi
              test "$(jq -r '.prerelease' "$PUBLISH_ROOT/existing-draft-rest.json")" = "true"
              test "$(jq -r '.tag_name' "$PUBLISH_ROOT/existing-draft-rest.json")" = "$RELEASE_TAG"
              test "$(jq -r '.target_commitish' "$PUBLISH_ROOT/existing-draft-rest.json" | tr '[:upper:]' '[:lower:]')" = "$RELEASE_SHA"
              jq -e 'all(.assets[]; (.id | type) == "number")' "$PUBLISH_ROOT/existing-draft-rest.json" >/dev/null
              while read -r asset_id; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done < <(jq -r '.assets[].id' "$PUBLISH_ROOT/existing-draft-rest.json")
              gh release edit "$RELEASE_TAG" \
                --target "$RELEASE_SHA" \
                --title "OpenTake $RELEASE_VERSION" \
                --notes-file "$PUBLISH_ROOT/release-body.md" \
                --draft --prerelease --latest=false
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Upload the exact payload to the draft
        run: gh release upload "$RELEASE_TAG" "$PUBLISH_ROOT/assets/"* --clobber

      - name: Verify draft target and exact assets
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId tagName tagCommit{oid} isDraft isPrerelease releaseAssets(first:100){nodes{id name size} pageInfo{hasNextPage}}}}}'
          gh api graphql \
            -f query="$query" -f owner="$owner" -f name="$repository" -f tag="$RELEASE_TAG" \
            > "$PUBLISH_ROOT/draft-release-graphql.json"
          python3 scripts/check_release_workflow.py resolve-release-state \
            --input "$PUBLISH_ROOT/draft-release-graphql.json" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --output "$PUBLISH_ROOT/draft-state.json"
          test "$(jq -r '.action' "$PUBLISH_ROOT/draft-state.json")" = "refresh"
          jq -r '.asset_names[]' "$PUBLISH_ROOT/draft-state.json" | LC_ALL=C sort > "$PUBLISH_ROOT/draft-assets.txt"
          cmp "$PUBLISH_ROOT/expected-assets.txt" "$PUBLISH_ROOT/draft-assets.txt"
          jq -e '.asset_sizes | length == 17 and all(. > 0)' "$PUBLISH_ROOT/draft-state.json" >/dev/null

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PUBLISH_ROOT"])
          state = json.loads((root / "draft-state.json").read_text(encoding="utf-8"))
          names = state.get("asset_names")
          sizes = state.get("asset_sizes")
          if not isinstance(names, list) or not isinstance(sizes, list):
              raise SystemExit("draft asset name/size mapping is missing")
          if len(names) != len(sizes) or len(set(names)) != len(names):
              raise SystemExit("draft asset name/size mapping is malformed")
          remote_sizes = dict(zip(names, sizes, strict=True))
          local_sizes = {
              path.name: path.stat().st_size
              for path in (root / "assets").iterdir()
              if path.is_file()
          }
          if remote_sizes != local_sizes:
              raise SystemExit("draft asset sizes do not match local payload")
          PY

          mkdir "$PUBLISH_ROOT/verified-draft"
          gh release download "$RELEASE_TAG" --dir "$PUBLISH_ROOT/verified-draft"
          find "$PUBLISH_ROOT/verified-draft" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$PUBLISH_ROOT/verified-draft-assets.txt"
          cmp "$PUBLISH_ROOT/expected-assets.txt" "$PUBLISH_ROOT/verified-draft-assets.txt"
          cmp "$PUBLISH_ROOT/assets/SHA256SUMS" "$PUBLISH_ROOT/verified-draft/SHA256SUMS"
          cd "$PUBLISH_ROOT/verified-draft"
          sha256sum --check SHA256SUMS

      - name: Revalidate remote tag before publication
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" \
            > "$PUBLISH_ROOT/remote-tag-before-publication.txt"
          python3 scripts/check_release_workflow.py resolve-remote-tag \
            --input "$PUBLISH_ROOT/remote-tag-before-publication.txt" \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"

      - name: Reassert exact source before publication
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          git cat-file -e "${expected}^{commit}"
          test "$(git rev-parse "${actual}^{tree}")" = "$(git rev-parse "${expected}^{tree}")"
          git diff --quiet --exit-code HEAD --
          git diff --cached --quiet --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Publish verified prerelease
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false

      - name: Verify public release through API and checksums
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$PUBLISH_ROOT/public-release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PUBLISH_ROOT"])
          release = json.loads((root / "public-release.json").read_text(encoding="utf-8"))
          expected_sha = os.environ["RELEASE_SHA"]
          expected_names = set((root / "expected-assets.txt").read_text(encoding="utf-8").splitlines())
          actual_names = {asset["name"] for asset in release.get("assets", [])}
          if release.get("draft") is not False or release.get("prerelease") is not True:
              raise SystemExit("release was not published as a prerelease")
          if release.get("tag_name") != os.environ["RELEASE_TAG"]:
              raise SystemExit("public release tag mismatch")
          if release.get("target_commitish") != expected_sha:
              raise SystemExit("public release target SHA mismatch")
          if expected_names != actual_names:
              raise SystemExit(f"public release assets mismatch: {sorted(actual_names)}")
          PY
          mkdir "$PUBLISH_ROOT/verified-release"
          gh release download "$RELEASE_TAG" --dir "$PUBLISH_ROOT/verified-release"
          find "$PUBLISH_ROOT/verified-release" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$PUBLISH_ROOT/verified-assets.txt"
          cmp "$PUBLISH_ROOT/expected-assets.txt" "$PUBLISH_ROOT/verified-assets.txt"
          cd "$PUBLISH_ROOT/verified-release"
          sha256sum --check SHA256SUMS
