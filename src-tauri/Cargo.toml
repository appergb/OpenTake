# OpenTake desktop shell (Tauri 2). Thin `#[tauri::command]` wrappers over
# `opentake-core`'s DTO handlers + a `CoreEvent` -> Tauri-event forwarder.
# See docs/ARCHITECTURE.md §2 and ../web for the React front end.

[package]
name = "opentake-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenTake desktop shell (Tauri 2)."

[lib]
name = "opentake_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opentake"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
opentake-core = { workspace = true }
opentake-project = { workspace = true }
opentake-ops = { workspace = true }
opentake-domain = { workspace = true }
# Transcription + visual semantic search are ON for the shipped app:
# `whisper-backend` compiles the whisper.cpp CPU backend (via cmake —
# preinstalled on GitHub runners, no CUDA); `ort-backend` links ONNX Runtime for
# the SigLIP2 dual-encoder — its `download-binaries` feature fetches a
# *statically* linked prebuilt onnxruntime at build time and bakes it into the
# binary (no runtime .so/.dylib to ship; same build-time-network shape as
# whisper.cpp / model-download); `model-download` pulls the model files over
# HTTPS with checksum verification. All three stay optional at the
# opentake-media level (its own default tests run offline, without them);
# ort-inference tests are feature-gated + runtime-skipped like the GPU/ffmpeg
# integration tests.
opentake-media = { workspace = true, features = ["whisper-backend", "ort-backend", "model-download"] }
opentake-render = { workspace = true }
opentake-gen = { workspace = true }
opentake-agent = { workspace = true }
# Preview composite frames are returned to the WebView as a base64 PNG data URL;
# the agent's `inspect_timeline` bridge encodes composited frames as JPEG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# Optional account scaffold: verify a token only against a user-configured
# backend. Rustls keeps the desktop build independent of a system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
same-file = "1"

# Streaming playback transport (#53 / #64), behind the `playback-engine` feature.
# Versions already resolved in the workspace lockfile (via opentake-agent), so
# enabling these pulls no new third-party crates (cpal arrives in the audio
# follow-up). `image/jpeg` is enabled by the feature for MJPEG frame encoding.
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync"], optional = true }
bytes = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
# Real-time audio output backing the playback master clock (#63). New crate:
# CoreAudio on macOS, ALSA on Linux (CI installs libasound2-dev for the
# playback-engine job). Off by default with the rest of the feature.
cpal = { version = "0.15", optional = true }

# macOS trackpad haptics for snap feedback (1:1 with upstream's
# NSHapticFeedbackManager). objc2-app-kit 0.3 is already in the lockfile via
# Tauri, so this only enables the NSHapticFeedback module (incremental build).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSHapticFeedback"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[features]
# `default` now includes `playback-engine`: the continuous Rust streaming engine
# is the shipped preview path (upstream's single always-composited surface), so a
# plain `cargo build`/`cargo test` compiles and exercises it. The feature is kept
# separate so a minimal build stays possible via `--no-default-features` (drops
# cpal/axum/tokio + the `playback_*` commands; the front-end flag then falls back
# to the legacy <video> path — see web/src/components/preview/rustEngine.ts).
default = ["playback-engine"]
# this feature is used for production builds or when `devUrl` is not set
custom-protocol = ["tauri/custom-protocol"]
# Continuous Rust streaming playback engine (#53): continuous per-clip decode →
# wgpu composite → MJPEG transport, with a cpal audio master clock. Of its deps
# only cpal is unique to this feature (audio out); axum/tokio/bytes/futures/
# image-jpeg are already in the workspace lockfile (via opentake-agent), so
# enabling it pulls just cpal + its small platform audio bindings.
playback-engine = ["dep:axum", "dep:tokio", "dep:bytes", "dep:futures", "dep:cpal", "image/jpeg"]
