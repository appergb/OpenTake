[package]
name = "opentake-motion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native motion fallback: deterministic RGBA frame cache, sandbox, stub renderer, and future alpha/HTML fallback for the Motion Canvas plugin plan. Issue #34 / docs/MOTION-GRAPHICS-PLUGIN.md."

[dependencies]
opentake-domain = { workspace = true }
opentake-process-tree = { workspace = true, optional = true }
# DecodedFrame / SourceMetrics / FrameProvider — the render crate DEFINES the
# clip-source contracts; we IMPLEMENT them so a motion clip is just another
# texture source to the compositor (zero special handling).
opentake-render = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
# Content-hash cache key over (source + params + fps + size). sha2 0.10 + hex are
# already vendored in Cargo.lock, so the build/test path stays fully offline.
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

# The live backend speaks Chrome DevTools Protocol directly. Both dependencies
# are feature-gated, so the default/offline crate keeps its existing surface.
base64 = { version = "0.22", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
tungstenite = { version = "0.29", optional = true, default-features = false, features = ["handshake"] }

[dev-dependencies]
# Offline PNG round-trip for the stub renderer's frame-file checks (mirrors the
# render crate's dev-dep; no network, no assets).
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[features]
default = []
# Gates the real headless-Chromium (CDP) backend behind a feature so neither the
# default build nor CI tests require a Chromium binary. Browser discovery and
# the fail-closed API compile unconditionally; live CDP wiring is feature-gated.
chromium = ["dep:base64", "dep:image", "dep:opentake-process-tree", "dep:tungstenite"]
