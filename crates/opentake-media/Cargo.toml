[package]
name = "opentake-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Decode/probe/thumbnail/waveform/transcribe/semantic-search (ffmpeg-sidecar CLI / whisper-rs / ort)."

[dependencies]
opentake-domain = { workspace = true }
opentake-process-tree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
ryu-js = "1.0.3"
dirs = "6"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
same-file = "1.0.6"

half = "2"
byteorder = "1"
ndarray = "0.16"
tracing = "0.1"
unicode-normalization = "0.1"
tempfile = "3"
rustfft = "6"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

# Media IO. We drive the system ffmpeg/ffprobe over the CLI rather than linking
# libav*: the local toolchain is ffmpeg 8.1 (libavcodec 62), which the C-binding
# crates (ffmpeg-next / ffmpeg-the-third) do not support, and pkg-config is not
# installed. ffmpeg-sidecar shells out to OpenTake's checksum-pinned packaged
# binaries (or PATH during development) — zero native linkage, and it never
# auto-downloads here (we only use its command/parse API).
# `default-features = false` drops the `download_ffmpeg` feature, whose ureq +
# rustls + zip/tar/xz2 stack is the crate's only HTTP/TLS dependency and is dead
# weight for us; the FfmpegCommand command/parse API lives in the always-on core.
ffmpeg-sidecar = { version = "2", default-features = false }

# Image decode/scale + JPEG sprite encode (image thumbnails, sprite cache,
# SigLIP squash-resize). Default features pull readers we do not need; keep it lean.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "tiff",
    "bmp",
    "gif",
] }

# SigLIP text tokenizer (same lineage as swift-transformers). onig regex backend
# matches the HF reference; no network at runtime (loads a local tokenizer.json).
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[features]
# Default build/test must stay offline and must NOT link onnxruntime or compile
# whisper.cpp. The heavy ML backends sit behind features; tests use mock impls.
default = []
# Test-only cross-crate fault boundaries. Shipped builds do not expose these
# hooks; integration tests opt in through a dev-dependency feature union.
test-faults = []
# Real SigLIP2 inference through ort. Windows uses ort's official pure-Rust
# tract backend so the installed product does not depend on Server-only
# DirectX/ONNX Runtime entry points. Other platforms keep the pinned native
# ONNX Runtime backend. Both remain off in the default, fully-offline build.
ort-backend = ["dep:ort", "dep:ort-tract"]
# Real on-device transcription via whisper.cpp (compiles native C++ on enable).
whisper-backend = ["dep:whisper-rs"]
# Model weight download/verify/unzip (reqwest + zip + sha1). Off by default so
# the default dependency tree carries no HTTP/TLS stack. `sha1` verifies whisper
# ggml downloads against whisper.cpp's published SHA-1 checksums.
model-download = ["dep:reqwest", "dep:zip", "dep:futures-util", "dep:sha1"]

[target.'cfg(not(windows))'.dependencies.ort]
version = "=2.0.0-rc.10"
default-features = false
features = ["std", "ndarray", "download-binaries", "copy-dylibs"]
optional = true

[target.'cfg(windows)'.dependencies.ort]
version = "=2.0.0-rc.10"
default-features = false
features = ["std", "ndarray", "alternative-backend"]
optional = true

[target.'cfg(windows)'.dependencies.ort-tract]
version = "=0.1.0"
optional = true

[dependencies.whisper-rs]
version = "0.14"
default-features = false
optional = true

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["stream", "rustls-tls"]
optional = true

[dependencies.zip]
version = "4"
default-features = false
features = ["deflate"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.sha1]
version = "0.10"
optional = true
